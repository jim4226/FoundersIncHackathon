name: Smoke checks

on:
  pull_request:
  push:
    branches:
      - main
      - claude/camera-eeg-hackathon-6v864b

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q backend gesture desk
      - name: Check browser JavaScript
        run: find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" HEAD
