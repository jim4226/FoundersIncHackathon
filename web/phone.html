<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>Bench — desk camera</title>
<style>
  :root {
    --bg: #08090c; --panel: #101319; --panel-2: #161a22; --line: #232936;
    --text: #e8ecf4; --muted: #8b95a8; --dim: #5c6478;
    --focus: #45e0c0; --warn: #ffb547; --danger: #ff5f56;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100svh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.on { background: var(--focus); box-shadow: 0 0 12px var(--focus); }
  .dot.bad { background: var(--danger); box-shadow: 0 0 12px var(--danger); }
  h1 { font-size: 15px; font-weight: 600; }
  header .state { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .stage { position: relative; flex: 1; display: flex; align-items: center; justify-content: center;
           background: #000; overflow: hidden; }
  video { position: absolute; inset: 0; width: 100%; height: 100%;
          object-fit: cover; display: block; }
  .frame-guide {
    position: absolute; inset: 8% 5%; border: 1px dashed rgba(69,224,192,0.35);
    border-radius: 14px; pointer-events: none;
  }
  .count {
    position: absolute; left: 14px; bottom: 14px;
    background: rgba(8,9,12,0.72); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; font-family: var(--mono); font-size: 12px; color: var(--focus);
  }

  .controls { padding: 16px 18px 22px; display: grid; gap: 12px; }
  button {
    width: 100%; padding: 15px; border-radius: 12px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    font: 600 15px inherit; font-family: inherit;
  }
  button.primary { border-color: var(--focus); color: var(--focus); background: #12211f; }
  button:active { transform: translateY(1px); }
  p.hint { color: var(--muted); font-size: 13px; }
  p.hint b { color: var(--text); font-weight: 600; }

  .notice {
    margin: 18px; padding: 16px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
  }
  .notice h2 { font-size: 15px; margin-bottom: 8px; color: var(--warn); }
  .notice p { color: var(--muted); font-size: 13.5px; margin-bottom: 8px; }
  .notice code { font-family: var(--mono); font-size: 12.5px; color: var(--text); word-break: break-all; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <h1>Desk camera</h1>
  <span class="state" id="state">starting…</span>
</header>

<div class="stage" id="stage">
  <video id="preview" playsinline muted autoplay></video>
  <div class="frame-guide"></div>
  <div class="count" id="count">—</div>
</div>

<div class="controls" id="controls">
  <button class="primary" id="calibrate">Capture empty desk</button>
  <p class="hint" id="hint">Prop the phone over the desk with the whole work area in
  frame, take everything off it, then tap <b>Capture empty desk</b>. Put your
  designs down afterwards — anything that wasn't there becomes an object.</p>
</div>

<div class="notice hidden" id="notice">
  <h2 id="notice-title">Camera unavailable</h2>
  <p id="notice-body"></p>
  <p><code id="notice-url"></code></p>
</div>

<script src="/static/phone.js"></script>
</body>
</html>
