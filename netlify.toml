[build]
  publish = "web"

# FastAPI serves these files from /static locally. On Netlify the publish
# directory is already web/, so keep the same browser URLs and rewrite them to
# the files at the publish root.
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200
  force = true

# FastAPI exposes these clean URLs locally. Keep the same navigation working
# when Netlify serves the corresponding static HTML files.
[[redirects]]
  from = "/desk"
  to = "/desk.html"
  status = 200

[[redirects]]
  from = "/project"
  to = "/project.html"
  status = 200
